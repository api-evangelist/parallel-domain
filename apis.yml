name: Parallel Domain
description: >-
  Parallel Domain is a synthetic-data and sensor-simulation platform for
  physical-AI and autonomy developers. It turns real-world drive and flight logs
  into photorealistic, simulation-ready digital replicas (PD Replica) and
  generates deterministic camera, lidar, and radar sensor data at scale (PD Sim),
  plus self-serve synthetic-data generation through its Data Lab service. The
  platform is driven through a first-party Python SDK (paralleldomain / pd-sdk)
  and an app console, integrating with existing autonomy stacks and CI/CD for
  training, testing, and regulatory validation of perception systems across
  automotive, trucking, drone, robotics, agriculture, and defense.
